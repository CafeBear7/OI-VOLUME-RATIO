name: 每日盤後更新

on:
  schedule:
    # 台灣時間每天 20:00（= UTC 12:00）。GitHub cron 一律用 UTC。
    - cron: "0 12 * * *"
  workflow_dispatch:            # 也可在 Actions 頁面手動觸發

permissions:
  contents: write               # 需要寫入權限才能把資料 commit 回 repo

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓資料並計算
        run: python3 fetch.py

      - name: 若有變動就 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.csv
          if git diff --cached --quiet; then
            echo "沒有變動，略過 commit"
          else
            git commit -m "資料更新 $(date -u +%Y-%m-%d)"
            git push
          fi
